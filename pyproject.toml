[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campuspulse-guardian"
version = "0.1.0"
description = "Grounded assignment checks with Gemini and the official GitHub MCP server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "pypdf>=6.21,<7", "python-docx>=1.1,<2", "google-genai>=2.31,<3",
  "mcp>=1.10,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
cloud = ["google-cloud-aiplatform[agent_engines]>=1.112,<2", "cloudpickle>=3,<4"]

[tool.setuptools.packages.find]
include = ["campuspulse*"]

[tool.setuptools.package-data]
campuspulse = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
